name: Readiness autofix

on:
  push:
    branches:
      - codex/production-readiness

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/production-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply narrow readiness fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"expected {count} occurrence(s) in {path}, found {found}: {old!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          # Ruff fixes and loop-variable binding in M2.
          replace(
              "src/leads_discovery/pipeline/m2_batch.py",
              "    if isinstance(max_results, bool) or not isinstance(max_results, int) or not 1 <= max_results <= 100:\n",
              "    if (\n        isinstance(max_results, bool)\n        or not isinstance(max_results, int)\n        or not 1 <= max_results <= 100\n    ):\n",
          )
          replace(
              "src/leads_discovery/pipeline/m2_batch.py",
              "        reservation = _exa_search_reservation(request.max_results_total) if request.provider == \"exa\" else request.max_cost_usd or 0.0\n",
              "        reservation = (\n            _exa_search_reservation(request.max_results_total)\n            if request.provider == \"exa\"\n            else request.max_cost_usd or 0.0\n        )\n",
          )
          replace(
              "src/leads_discovery/pipeline/m2_batch.py",
              "            cumulative_items = [deepcopy(item) for item in company.evidence]\n\n            def persist_progress(\n",
              "            cumulative_items = [deepcopy(item) for item in company.evidence]\n            research_result_caps = tuple(item.max_results for item in research_requests)\n\n            def persist_progress(\n",
          )
          replace(
              "src/leads_discovery/pipeline/m2_batch.py",
              "                budget_checked: bool = resumable_researcher,\n            ) -> None:\n                \"\"\"Fsync one Exa call, reserve the next, then stop locally before over-budget work.\"\"\"\n",
              "                budget_checked: bool = resumable_researcher,\n                result_caps: tuple[int, ...] = research_result_caps,\n            ) -> None:\n                \"\"\"Persist one Exa result, reserve the next, and stop before over-budget work.\"\"\"\n",
          )
          replace(
              "src/leads_discovery/pipeline/m2_batch.py",
              "                    _exa_search_reservation(research_requests[calls].max_results)\n",
              "                    _exa_search_reservation(result_caps[calls])\n",
          )

          # DeepSeek: preserve known-safe retryability and report all exhausted attempts.
          replace(
              "src/leads_discovery/research/extract.py",
              "                    retryable=False if retryable else retryable,\n",
              "                    retryable=retryable,\n",
          )
          replace(
              "src/leads_discovery/research/extract.py",
              "            except DiscoveryProviderError as exc:\n                if exc.kind == \"invalid_response\" and attempt < _MAX_ATTEMPTS:\n                    continue\n                raise\n",
              "            except DiscoveryProviderError as exc:\n                if exc.kind == \"invalid_response\" and attempt < _MAX_ATTEMPTS:\n                    continue\n                if exc.kind == \"invalid_response\":\n                    raise self._invalid(\n                        company.company_id, response.status_code, attempt\n                    ) from None\n                raise\n",
          )

          # M4 Exa People budget must reserve the fixed 10-result highlights request.
          replace(
              "src/leads_discovery/pipeline/contact_enrichment.py",
              "_FORMULA_PREFIXES: Final[frozenset[str]] = frozenset(\"=+-@\")\n",
              "_FORMULA_PREFIXES: Final[frozenset[str]] = frozenset(\"=+-@\")\n_EXA_PEOPLE_RESERVATION_USD: Final[float] = 0.017\n",
          )
          replace(
              "src/leads_discovery/pipeline/contact_enrichment.py",
              "            if spend >= config.exa_people_budget_usd:\n",
              "            if (\n                spend + _EXA_PEOPLE_RESERVATION_USD\n                > config.exa_people_budget_usd + 1e-12\n            ):\n",
          )

          # Explicit provider timeouts for normal synchronous M2/M4 clients.
          replace(
              "src/leads_discovery/cli.py",
              "    with httpx.Client() as client:\n",
              "    with httpx.Client(timeout=httpx.Timeout(30.0, connect=5.0)) as client:\n",
              count=1,
          )
          replace(
              "src/leads_discovery/cli.py",
              "    with httpx.Client() as client:\n",
              "    with httpx.Client(timeout=httpx.Timeout(30.0, connect=5.0)) as client:\n",
              count=1,
          )

          # M4 HTTP response bounds and ambiguous transport classification.
          providers = Path("src/leads_discovery/contacts/providers.py")
          text = providers.read_text(encoding="utf-8")
          text = text.replace("import math\nimport re\n", "import math\nimport os\nimport re\n", 1)
          text = text.replace(
              "_INSTANTLY_VERIFY_URL = \"https://api.instantly.ai/api/v2/email-verification\"\n",
              "_INSTANTLY_VERIFY_URL = \"https://api.instantly.ai/api/v2/email-verification\"\n_DEFAULT_MAX_HTTP_RESPONSE_BYTES = 2 * 1024 * 1024\n",
              1,
          )
          marker = "\ndef _status_kind(status_code: int) -> tuple[ErrorKind, bool]:\n"
          helper = '''\ndef _http_response_limit() -> int:\n    \"\"\"Return the configurable maximum contact-provider response bytes.\"\"\"\n    raw = os.getenv(\"LEADS_MAX_HTTP_RESPONSE_BYTES\")\n    if raw is None:\n        return _DEFAULT_MAX_HTTP_RESPONSE_BYTES\n    try:\n        value = int(raw)\n    except ValueError as exc:\n        raise ValueError(\"LEADS_MAX_HTTP_RESPONSE_BYTES must be a positive integer\") from exc\n    if value <= 0:\n        raise ValueError(\"LEADS_MAX_HTTP_RESPONSE_BYTES must be a positive integer\")\n    return value\n\n'''
          if marker not in text:
              raise SystemExit("contact provider status marker missing")
          text = text.replace(marker, helper + marker, 1)
          old_call = '''def _call(\n    call: Any,\n    *,\n    provider: str,\n    operation: str,\n    metadata: dict[str, Any] | None = None,\n) -> httpx.Response:\n    \"\"\"Execute one caller-injected HTTP operation without retries and sanitize transport errors.\"\"\"\n    try:\n        return cast(httpx.Response, call())\n    except httpx.HTTPError:\n        _raise(\n            provider,\n            operation,\n            kind=\"transient\",\n            retryable=True,\n            metadata=metadata,\n        )\n    raise AssertionError(\"unreachable\")\n'''
          new_call = '''def _call(\n    call: Any,\n    *,\n    provider: str,\n    operation: str,\n    metadata: dict[str, Any] | None = None,\n) -> httpx.Response:\n    \"\"\"Execute one bounded HTTP call and preserve ambiguous paid outcomes.\"\"\"\n    try:\n        response = cast(httpx.Response, call())\n    except (httpx.ConnectError, httpx.ConnectTimeout):\n        _raise(\n            provider,\n            operation,\n            kind=\"transient\",\n            retryable=True,\n            metadata={**(metadata or {}), \"safe_to_retry\": True},\n        )\n    except httpx.HTTPError:\n        _raise(\n            provider,\n            operation,\n            kind=\"transient\",\n            retryable=False,\n            metadata={**(metadata or {}), \"outcome_unknown\": True},\n        )\n    raw_length = response.headers.get(\"content-length\")\n    if raw_length is not None:\n        try:\n            declared = int(raw_length)\n        except ValueError:\n            declared = 0\n        if declared > _http_response_limit():\n            response.close()\n            _raise(\n                provider,\n                operation,\n                kind=\"invalid_response\",\n                retryable=False,\n                status_code=response.status_code,\n                metadata=metadata,\n            )\n    if response.is_stream_consumed and len(response.content) > _http_response_limit():\n        _raise(\n            provider,\n            operation,\n            kind=\"invalid_response\",\n            retryable=False,\n            status_code=response.status_code,\n            metadata=metadata,\n        )\n    return response\n'''
          if old_call not in text:
              raise SystemExit("contact provider _call block missing")
          providers.write_text(text.replace(old_call, new_call, 1), encoding="utf-8")

          # Add total per-run disk bound to the existing file/record limits.
          state = Path("src/leads_discovery/pipeline/state.py")
          text = state.read_text(encoding="utf-8")
          text = text.replace(
              "_DEFAULT_MAX_FILE_BYTES = 16 * 1024 * 1024\n_DEFAULT_MAX_RECORDS = 10_000\n",
              "_DEFAULT_MAX_FILE_BYTES = 16 * 1024 * 1024\n_DEFAULT_MAX_RUN_BYTES = 64 * 1024 * 1024\n_DEFAULT_MAX_RECORDS = 10_000\n",
              1,
          )
          text = text.replace(
              "def _record_count_limit() -> int:\n    \"\"\"Return the maximum number of records accepted from one JSONL artifact.\"\"\"\n    return _positive_limit(\"LEADS_MAX_RECORDS\", _DEFAULT_MAX_RECORDS)\n\n",
              "def _run_limit() -> int:\n    \"\"\"Return the maximum total bytes allowed in one run directory.\"\"\"\n    return _positive_limit(\"LEADS_MAX_RUN_BYTES\", _DEFAULT_MAX_RUN_BYTES)\n\n\ndef _record_count_limit() -> int:\n    \"\"\"Return the maximum number of records accepted from one JSONL artifact.\"\"\"\n    return _positive_limit(\"LEADS_MAX_RECORDS\", _DEFAULT_MAX_RECORDS)\n\n",
              1,
          )
          marker = "\ndef _serialized_line(payload: dict[str, Any]) -> bytes:\n"
          helper = '''\ndef _directory_bytes(parent: Path, *, exclude: Path | None = None) -> int:\n    \"\"\"Count regular run files while rejecting symlinks in persisted state.\"\"\"\n    if not parent.exists():\n        return 0\n    _ensure_directory(parent)\n    total = 0\n    for child in parent.iterdir():\n        if exclude is not None and child == exclude:\n            continue\n        if child.is_symlink():\n            raise ValueError(\"run directory must not contain symlinks\")\n        if child.is_file():\n            total += child.stat().st_size\n    return total\n\n\ndef _ensure_existing_run_size(parent: Path) -> None:\n    \"\"\"Reject persisted state whose aggregate run bytes exceed the configured ceiling.\"\"\"\n    if _directory_bytes(parent) > _run_limit():\n        raise ValueError(\"persisted run exceeds LEADS_MAX_RUN_BYTES\")\n\n\ndef _ensure_run_size(path: Path, final_size: int) -> None:\n    \"\"\"Reject a write before its final run-directory size would exceed the ceiling.\"\"\"\n    if _directory_bytes(path.parent, exclude=path) + final_size > _run_limit():\n        raise ValueError(\"persisted run would exceed LEADS_MAX_RUN_BYTES\")\n\n'''
          if marker not in text:
              raise SystemExit("state serialized marker missing")
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              "    _ensure_file_growth(path, len(data))\n    is_new = not path.exists()\n",
              "    _ensure_file_growth(path, len(data))\n    current = path.stat().st_size if path.exists() else 0\n    _ensure_run_size(path, current + len(data))\n    is_new = not path.exists()\n",
              1,
          )
          text = text.replace(
              "    if path.is_symlink() or not path.is_file():\n        raise ValueError(\"JSONL artifact must be a regular non-symlink file\")\n",
              "    _ensure_existing_run_size(path.parent)\n    if path.is_symlink() or not path.is_file():\n        raise ValueError(\"JSONL artifact must be a regular non-symlink file\")\n",
              1,
          )
          text = text.replace(
              "    path.parent.mkdir(parents=True, exist_ok=True)\n    _ensure_directory(path.parent)\n    temp_path: Path | None = None\n",
              "    path.parent.mkdir(parents=True, exist_ok=True)\n    _ensure_directory(path.parent)\n    _ensure_run_size(path, len(data))\n    temp_path: Path | None = None\n",
              1,
          )
          text = text.replace(
              "    temp_path: Path | None = None\n    total = 0\n    count = 0\n",
              "    temp_path: Path | None = None\n    base_run_bytes = _directory_bytes(path.parent, exclude=path)\n    total = 0\n    count = 0\n",
              1,
          )
          text = text.replace(
              "                if total > _file_limit():\n                    raise ValueError(\"persisted artifact exceeds LEADS_MAX_FILE_BYTES\")\n                handle.write(data)\n",
              "                if total > _file_limit():\n                    raise ValueError(\"persisted artifact exceeds LEADS_MAX_FILE_BYTES\")\n                if base_run_bytes + total > _run_limit():\n                    raise ValueError(\"persisted run would exceed LEADS_MAX_RUN_BYTES\")\n                handle.write(data)\n",
              1,
          )
          text = text.replace(
              "    if path.is_symlink() or not path.is_file():\n        raise ValueError(\"JSON artifact must be a regular non-symlink file\")\n",
              "    _ensure_existing_run_size(path.parent)\n    if path.is_symlink() or not path.is_file():\n        raise ValueError(\"JSON artifact must be a regular non-symlink file\")\n",
              1,
          )
          state.write_text(text, encoding="utf-8")

          # Production workflow uses a stricter run-total ceiling than library defaults.
          replace(
              ".github/workflows/generate-leads.yml",
              "          LEADS_MAX_FILE_BYTES: \"4194304\"\n",
              "          LEADS_MAX_FILE_BYTES: \"4194304\"\n          LEADS_MAX_RUN_BYTES: \"8388608\"\n",
          )

          # CI validates the normal gates, a true offline dry run, and workflow safety statically.
          Path(".github/workflows/ci.yml").write_text('''name: CI\n\non:\n  push:\n    branches:\n      - main\n      - "feat/**"\n  pull_request:\n\njobs:\n  validate:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v4\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n          cache: pip\n      - name: Install package and development tools\n        run: python -m pip install -e ".[dev]"\n      - name: Lint\n        run: ruff check .\n      - name: Typecheck\n        run: mypy src tests\n      - name: Test\n        run: pytest\n      - name: Build\n        run: python -m build\n      - name: Offline dry run\n        run: python -m leads_discovery run --run-id ci-dry --deepseek-budget-usd 0.01\n      - name: Validate production workflow safety\n        run: |\n          python - <<'PY'\n          from pathlib import Path\n          text = Path(".github/workflows/generate-leads.yml").read_text(encoding="utf-8")\n          trigger = text.split("permissions:", 1)[0]\n          assert "workflow_dispatch:" in trigger\n          assert "push:" not in trigger\n          assert "pull_request:" not in trigger\n          assert "schedule:" not in trigger\n          assert "inputs:" not in trigger\n          assert "runs-on: ubuntu-latest" in text\n          assert "actions/upload-artifact" not in text\n          assert "python -m leads_discovery.production_canary" in text\n          assert "generated-leads" in text\n          PY\n''', encoding="utf-8")

          # Concise production runtime documentation.
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          if "## Production canary" not in text:
              text += '''\n## Production canary\n\nProduction execution does not depend on a local computer. The production entry point is the manual `Production lead canary` GitHub Actions workflow on a standard GitHub-hosted `ubuntu-latest` runner. Provider credentials live only in GitHub Actions repository secrets.\n\nThe workflow has no safety-limit inputs: the application fixes the canary at one company, one paid contact, tiny provider quotas, and tiny spend/storage ceilings. Paid-operation barriers are written durably before dispatch so a runner restart cannot silently repeat an unresolved potentially billed operation.\n\nOnly `leads.csv` and `contacts.jsonl` are published to the dedicated `generated-leads` Git branch. Checkpoints, usage ledgers, provider payloads, credentials, temporary files, and debug state are not published as branch files or Actions artifacts.\n\nA real credentialed one-company workflow run is the final external acceptance gate. Automated CI and development remain offline and do not prove live provider compatibility.\n'''
              readme.write_text(text, encoding="utf-8")

          env = Path(".env.example")
          env_text = env.read_text(encoding="utf-8")
          if "LEADS_MAX_RUN_BYTES" not in env_text:
              env_text += '''\n# Optional local persistence safety bounds (production workflow sets stricter values)\nLEADS_MAX_HTTP_RESPONSE_BYTES=2097152\nLEADS_MAX_RECORD_BYTES=262144\nLEADS_MAX_FILE_BYTES=16777216\nLEADS_MAX_RUN_BYTES=67108864\nLEADS_MAX_RECORDS=10000\n'''
              env.write_text(env_text, encoding="utf-8")
          PY
      - name: Add focused production-readiness tests
        shell: bash
        run: |
          cat > tests/test_production_readiness.py <<'PY'
          """Focused production-readiness tests for paid recovery and bounded execution."""

          from __future__ import annotations

          import json
          import subprocess
          from collections.abc import Sequence
          from pathlib import Path
          from typing import Any

          import httpx
          import pytest

          from leads_discovery import production_canary
          from leads_discovery.contacts.providers import (
              ApolloResult,
              ClayResults,
              ClayStartResult,
              ExaPeopleResult,
              VerificationResult,
          )
          from leads_discovery.discovery.base import DiscoveryProviderError, safe_transport_call
          from leads_discovery.models import (
              CompanyRecord,
              EvidenceBundle,
              EvidenceItem,
              ExtractedFact,
              ExtractionResult,
              RunCheckpoint,
              UsageEvent,
          )
          from leads_discovery.pipeline.contact_enrichment import (
              ContactEnrichmentConfig,
              run_contact_enrichment,
          )
          from leads_discovery.pipeline.costs import CostTracker
          from leads_discovery.pipeline.git_journal import sync_checkpoint_barrier
          from leads_discovery.pipeline.m2_batch import _provider_budget_allows
          from leads_discovery.pipeline.state import (
              append_jsonl,
              iter_jsonl,
              write_jsonl_atomic,
              write_text_atomic,
          )
          from leads_discovery.research.extract import (
              FACT_KEYS,
              DeepSeekExtractor,
              DeepSeekPriceSchedule,
              apply_extraction,
          )

          _EVIDENCE_ID = "ev_000000000000000000000001"


          def _company() -> CompanyRecord:
              """Build one canonical company for readiness tests."""
              return CompanyRecord(
                  company_id="cmp_acme",
                  name="Acme Valve",
                  normalized_name="acme valve",
                  domain="acme.com",
                  normalized_domain="acme.com",
                  country="US",
              )


          def _bundle(excerpt: str = "Acme distributes industrial valves and fittings.") -> EvidenceBundle:
              """Build one bounded evidence bundle."""
              return EvidenceBundle(
                  company_id="cmp_acme",
                  items=[
                      EvidenceItem(
                          evidence_id=_EVIDENCE_ID,
                          url="https://acme.com/about",
                          title="About Acme",
                          excerpt=excerpt,
                          provider="exa",
                      )
                  ],
                  raw_records=[],
                  usage_events=[],
              )


          def _facts() -> dict[str, dict[str, Any]]:
              """Build the exact DeepSeek fact schema with one supported positive fact."""
              facts = {
                  key: {"value": None, "confidence": 0, "evidence_ids": []}
                  for key in FACT_KEYS
              }
              facts["pvf_relevant"] = {
                  "value": True,
                  "confidence": 0.9,
                  "evidence_ids": [_EVIDENCE_ID],
              }
              return facts


          def _deepseek_response(content: str) -> dict[str, Any]:
              """Build one valid DeepSeek response envelope around supplied model content."""
              return {
                  "choices": [{"message": {"content": content}, "finish_reason": "stop"}],
                  "usage": {
                      "prompt_cache_hit_tokens": 1,
                      "prompt_cache_miss_tokens": 1,
                      "completion_tokens": 1,
                      "total_tokens": 3,
                  },
              }


          def test_ambiguous_paid_operation_cannot_redispatch_after_remote_restart_barrier(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              """A remote in-flight barrier blocks the same paid operation after local loss."""
              remote = tmp_path / "remote.git"
              work = tmp_path / "work"
              subprocess.run(
                  ["git", "init", "--bare", str(remote)], check=True, capture_output=True, text=True
              )
              work.mkdir()
              subprocess.run(["git", "init"], cwd=work, check=True, capture_output=True, text=True)
              subprocess.run(
                  ["git", "config", "user.name", "Test Bot"],
                  cwd=work,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              subprocess.run(
                  ["git", "config", "user.email", "test@example.invalid"],
                  cwd=work,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              (work / "seed").write_text("seed\n", encoding="utf-8")
              subprocess.run(["git", "add", "seed"], cwd=work, check=True, capture_output=True, text=True)
              subprocess.run(
                  ["git", "commit", "-m", "seed"], cwd=work, check=True, capture_output=True, text=True
              )
              subprocess.run(
                  ["git", "branch", "-M", "generated-leads"],
                  cwd=work,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              subprocess.run(
                  ["git", "remote", "add", "origin", str(remote)],
                  cwd=work,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              subprocess.run(
                  ["git", "push", "-u", "origin", "generated-leads"],
                  cwd=work,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              monkeypatch.setenv("GITHUB_WORKSPACE", str(work))
              monkeypatch.setenv("LEADS_GIT_JOURNAL_BRANCH", "generated-leads")
              monkeypatch.setenv("LEADS_GIT_JOURNAL_REMOTE", "origin")
              checkpoint = RunCheckpoint(
                  run_id="restart",
                  provider_state={
                      "operations": {
                          "discovery:one": {
                              "provider": "exa",
                              "operation": "company_search",
                              "state": "in_flight",
                          }
                      }
                  },
              )
              sync_checkpoint_barrier(checkpoint, None)
              with pytest.raises(RuntimeError, match="durable non-retryable"):
                  sync_checkpoint_barrier(checkpoint, None)


          def test_budget_reservation_blocks_call_that_could_cross_ceiling() -> None:
              """Committed spend plus next worst-case cost must fit before dispatch."""
              tracker = CostTracker(
                  [UsageEvent(provider="exa", operation="search", estimated_cost_usd=0.99)]
              )
              assert not _provider_budget_allows(tracker, "exa", 1.0, 0.017)


          def test_deepseek_empty_and_malformed_json_retry_within_fixed_bound() -> None:
              """Empty and malformed model content retry and the final success accounts all attempts."""
              contents = ["", "{", json.dumps({"facts": _facts()})]
              calls = 0

              def handler(_request: httpx.Request) -> httpx.Response:
                  nonlocal calls
                  content = contents[calls]
                  calls += 1
                  return httpx.Response(200, json=_deepseek_response(content))

              with httpx.Client(transport=httpx.MockTransport(handler)) as client:
                  result = DeepSeekExtractor(
                      api_key="test",
                      client=client,
                      model="deepseek-v4-flash",
                      prices=DeepSeekPriceSchedule(0.0, 0.0, 0.0),
                  ).extract(_company(), _bundle())
              assert calls == 3
              assert result.usage_event.request_count == 3


          def test_deepseek_schema_invalid_exhaustion_accounts_all_attempts() -> None:
              """Schema-invalid model output exhausts exactly three attempts without poisoning attempt one."""
              calls = 0

              def handler(_request: httpx.Request) -> httpx.Response:
                  nonlocal calls
                  calls += 1
                  return httpx.Response(200, json=_deepseek_response('{"facts": {}}'))

              with httpx.Client(transport=httpx.MockTransport(handler)) as client:
                  extractor = DeepSeekExtractor(
                      api_key="test",
                      client=client,
                      model="deepseek-v4-flash",
                      prices=DeepSeekPriceSchedule(0.0, 0.0, 0.0),
                  )
                  with pytest.raises(DiscoveryProviderError) as captured:
                      extractor.extract(_company(), _bundle())
              assert calls == 3
              assert captured.value.kind == "invalid_response"
              assert captured.value.usage_event.request_count == 3


          def test_unsupported_hard_negative_becomes_unknown() -> None:
              """A cited ID without explicit negative support cannot reject PVF relevance."""
              facts = {key: ExtractedFact(None, 0.0, []) for key in FACT_KEYS}
              facts["pvf_relevant"] = ExtractedFact(False, 0.99, [_EVIDENCE_ID])
              result = ExtractionResult(
                  company_id="cmp_acme",
                  model="deepseek-v4-flash",
                  facts=facts,
                  usage_event=UsageEvent(provider="deepseek", operation="structured_extraction"),
              )
              updated = apply_extraction(_company(), _bundle(), result)
              assert updated.features["pvf_relevant"] is None
              assert updated.feature_confidence["pvf_relevant"] == {
                  "confidence": 0.0,
                  "evidence_ids": [],
              }


          def test_oversized_provider_response_is_rejected(monkeypatch: pytest.MonkeyPatch) -> None:
              """Declared oversized provider responses fail before JSON parsing or persistence."""
              monkeypatch.setenv("LEADS_MAX_HTTP_RESPONSE_BYTES", "10")
              with pytest.raises(DiscoveryProviderError):
                  safe_transport_call(
                      lambda: httpx.Response(
                          200, content=b"x" * 11, headers={"content-length": "11"}
                      ),
                      provider="exa",
                      request_id="one",
                      operation="search",
                      request_count=1,
                  )


          def test_replay_is_incremental_and_oversized_record_fails_at_that_record(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              """A good first replay row is yielded before an oversized later row is rejected."""
              monkeypatch.setenv("LEADS_MAX_RECORD_BYTES", "32")
              monkeypatch.setenv("LEADS_MAX_FILE_BYTES", "1024")
              path = tmp_path / "events.jsonl"
              path.write_bytes(b'{"ok":1}\n' + b'{"x":"' + b"a" * 100 + b'"}\n')
              rows = iter_jsonl(path)
              assert next(rows) == {"ok": 1}
              with pytest.raises(ValueError, match="record exceeds"):
                  next(rows)


          def test_total_run_disk_limit_stops_before_second_write(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              """Aggregate persisted bytes are checked before another artifact is committed."""
              monkeypatch.setenv("LEADS_MAX_FILE_BYTES", "100")
              monkeypatch.setenv("LEADS_MAX_RUN_BYTES", "40")
              write_text_atomic(tmp_path / "one.txt", "a" * 30)
              with pytest.raises(ValueError, match="run would exceed"):
                  write_text_atomic(tmp_path / "two.txt", "b" * 20)
              assert not (tmp_path / "two.txt").exists()


          def test_atomic_write_rejects_symlink_target(tmp_path: Path) -> None:
              """An output symlink cannot redirect an atomic write outside the intended root."""
              outside = tmp_path / "outside.txt"
              outside.write_text("sentinel", encoding="utf-8")
              root = tmp_path / "run"
              root.mkdir()
              target = root / "leads.csv"
              target.symlink_to(outside)
              with pytest.raises(ValueError, match="symlink"):
                  write_text_atomic(target, "changed")
              assert outside.read_text(encoding="utf-8") == "sentinel"


          def test_jsonl_snapshot_honors_record_and_run_bounds(
              tmp_path: Path, monkeypatch: pytest.MonkeyPatch
          ) -> None:
              """Atomic JSONL snapshots enforce record and aggregate disk limits while streaming."""
              monkeypatch.setenv("LEADS_MAX_RECORD_BYTES", "64")
              monkeypatch.setenv("LEADS_MAX_FILE_BYTES", "128")
              monkeypatch.setenv("LEADS_MAX_RUN_BYTES", "128")
              with pytest.raises(ValueError, match="record exceeds"):
                  write_jsonl_atomic(tmp_path / "rows.jsonl", ({"x": "a" * 100} for _ in range(1)))


          class _BombExa:
              """Fail if M4 dispatches an Exa People call after its pre-call budget gate."""

              def search(self, _company: CompanyRecord) -> ExaPeopleResult:
                  """Reject any dispatch."""
                  raise AssertionError("Exa People budget gate must stop before dispatch")


          class _BombClay:
              """Unused Clay fake for a pre-Exa budget stop."""

              def start(self, _contacts: list[Any]) -> ClayStartResult:
                  """Reject unexpected Clay use."""
                  raise AssertionError("Clay should not run")

              def results(self, _routine_run_id: str) -> ClayResults:
                  """Reject unexpected Clay polling."""
                  raise AssertionError("Clay should not run")


          class _BombApollo:
              """Unused Apollo fake for a pre-Exa budget stop."""

              def enrich(self, _contact: Any) -> ApolloResult:
                  """Reject unexpected Apollo use."""
                  raise AssertionError("Apollo should not run")


          class _BombInstantly:
              """Unused Instantly fake for a pre-Exa budget stop."""

              def create(self, _email: str) -> VerificationResult:
                  """Reject unexpected Instantly use."""
                  raise AssertionError("Instantly should not run")

              def get(self, _email: str) -> VerificationResult:
                  """Reject unexpected Instantly polling."""
                  raise AssertionError("Instantly should not run")


          def test_m4_exa_people_budget_reserves_worst_case_before_dispatch(tmp_path: Path) -> None:
              """M4 must stop before a fixed People Search could cross its USD ceiling."""
              run_dir = tmp_path / "m4-budget"
              run_dir.mkdir()
              company = _company()
              company.final_decision = "accepted"
              company.stage_status["decision"] = "completed"
              write_jsonl_atomic(run_dir / "companies_evaluated.jsonl", [company.to_dict()])
              append_jsonl(
                  run_dir / "contact_usage_events.jsonl",
                  UsageEvent(
                      provider="exa",
                      operation="people_search",
                      estimated_cost_usd=0.99,
                  ).to_dict(),
              )
              summary = run_contact_enrichment(
                  ContactEnrichmentConfig(
                      run_id="m4-budget",
                      data_root=tmp_path,
                      exa_people_budget_usd=1.0,
                      execute_live=True,
                  ),
                  exa=_BombExa(),
                  clay=_BombClay(),
                  apollo=_BombApollo(),
                  instantly=_BombInstantly(),
              )
              assert summary.status == "paused_budget"


          def test_canary_limits_are_not_cli_inputs(monkeypatch: pytest.MonkeyPatch) -> None:
              """The canary exposes only run identity/data root and always injects fixed tiny limits."""
              calls: list[list[str]] = []

              def fake_cli(argv: Sequence[str] | None = None) -> int:
                  """Capture the immutable commands emitted by the canary wrapper."""
                  assert argv is not None
                  calls.append(list(argv))
                  return 0

              monkeypatch.setattr(production_canary, "cli_main", fake_cli)
              assert production_canary.main(["--run-id", "canary-one"]) == 0
              assert len(calls) == 2
              run, enrich = calls
              assert run[run.index("--max-candidates") + 1] == "1"
              assert run[run.index("--max-evaluated") + 1] == "1"
              assert enrich[enrich.index("--max-contacts-per-company") + 1] == "1"
              assert enrich[enrich.index("--max-paid-contacts-per-company") + 1] == "1"
              with pytest.raises(SystemExit):
                  production_canary._parser().parse_args(
                      ["--run-id", "canary-one", "--max-candidates", "2"]
                  )


          def test_paid_workflow_is_manual_only_and_publishes_only_approved_outputs() -> None:
              """Static production workflow controls cannot be widened by dispatch inputs."""
              root = Path(__file__).resolve().parents[1]
              text = (root / ".github/workflows/generate-leads.yml").read_text(encoding="utf-8")
              trigger = text.split("permissions:", 1)[0]
              assert "workflow_dispatch:" in trigger
              assert "push:" not in trigger
              assert "pull_request:" not in trigger
              assert "schedule:" not in trigger
              assert "inputs:" not in trigger
              assert "runs-on: ubuntu-latest" in text
              assert "actions/upload-artifact" not in text
              assert "git rm -rf --ignore-unmatch ." in text
              assert 'cp -- "$run_dir/leads.csv"' in text
              assert 'cp -- "$run_dir/contacts.jsonl"' in text
              assert "contact_checkpoint.json" not in text
              assert "contact_usage_events.jsonl" not in text
