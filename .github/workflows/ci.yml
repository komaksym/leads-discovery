name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy src tests
      - name: Target extraction and transport safety
        run: pytest -q tests/test_extraction.py tests/test_transport_safety.py
      - name: Target Apify and Exa paths
        run: pytest -q tests/test_apify_discovery.py tests/test_exa_discovery.py tests/test_evidence.py
      - name: Test
        run: pytest
      - name: Build
        run: python -m build
