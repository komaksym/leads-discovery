name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy src tests
      - name: Test
        run: pytest
      - name: Build
        run: python -m build
      - name: Offline dry run
        run: python -m leads_discovery run --run-id ci-dry --deepseek-budget-usd 0.01
      - name: Validate production workflow safety
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/generate-leads.yml").read_text(encoding="utf-8")
          trigger = text.split("permissions:", 1)[0]
          assert "workflow_dispatch:" in trigger
          assert "push:" not in trigger
          assert "pull_request:" not in trigger
          assert "schedule:" not in trigger
          assert "inputs:" not in trigger
          assert "runs-on: ubuntu-latest" in text
          assert "actions/upload-artifact" not in text
          assert "python -m leads_discovery.production_canary" in text
          assert "generated-leads" in text
          PY
