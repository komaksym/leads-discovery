name: M4 Frozen Contract Validation

on:
  pull_request:
    branches:
      - codex/m4-production

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint production
        run: ruff check src
      - name: Typecheck production
        run: mypy src
      - name: Run complete combined pytest suite
        run: pytest
      - name: Build
        run: python -m build
