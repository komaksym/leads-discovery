name: Readiness autofix v4

on:
  push:
    branches:
      - codex/production-readiness

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/production-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply readiness patch and test alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path('.github/workflows/readiness-autofix.yml').read_text(encoding='utf-8').splitlines()
          for step_name in ('Apply narrow readiness fixes', 'Add focused production-readiness tests'):
              header = f'      - name: {step_name}'
              start = lines.index(header)
              run_index = next(
                  index for index in range(start + 1, len(lines))
                  if lines[index] == '        run: |'
              )
              end = next(
                  (
                      index for index in range(run_index + 1, len(lines))
                      if lines[index].startswith('      - name:')
                  ),
                  len(lines),
              )
              body: list[str] = []
              for line in lines[run_index + 1:end]:
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif line.strip():
                      raise SystemExit(f'unexpected indentation in {step_name}: {line!r}')
                  else:
                      body.append('')
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', '\n'.join(body) + '\n'],
                  check=True,
              )

          tests = Path('tests/test_production_readiness.py')
          source = tests.read_text(encoding='utf-8')
          source = source.replace(
              '    facts = {\n        key: {"value": None, "confidence": 0, "evidence_ids": []}\n',
              '    facts: dict[str, dict[str, Any]] = {\n        key: {"value": None, "confidence": 0, "evidence_ids": []}\n',
              1,
          )
          insert_after = '''def test_replay_is_incremental_and_oversized_record_fails_at_that_record(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    \"\"\"A good first replay row is yielded before an oversized later row is rejected.\"\"\"\n    monkeypatch.setenv(\"LEADS_MAX_RECORD_BYTES\", \"32\")\n    monkeypatch.setenv(\"LEADS_MAX_FILE_BYTES\", \"1024\")\n    path = tmp_path / \"events.jsonl\"\n    path.write_bytes(b'{\"ok\":1}\\n' + b'{\"x\":\"' + b\"a\" * 100 + b'\"}\\n')\n    rows = iter_jsonl(path)\n    assert next(rows) == {\"ok\": 1}\n    with pytest.raises(ValueError, match=\"record exceeds\"):\n        next(rows)\n\n\n'''
          extra = '''def test_oversized_replay_file_is_rejected_before_iteration(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    \"\"\"A replay file over the configured file ceiling fails closed before rows are used.\"\"\"\n    monkeypatch.setenv(\"LEADS_MAX_RECORD_BYTES\", \"64\")\n    monkeypatch.setenv(\"LEADS_MAX_FILE_BYTES\", \"8\")\n    path = tmp_path / \"events.jsonl\"\n    path.write_bytes(b'{\"ok\":1}\\n')\n    with pytest.raises(ValueError, match=\"artifact exceeds\"):\n        list(iter_jsonl(path))\n\n\ndef test_replay_record_count_is_bounded(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    \"\"\"Replay stops when the configured record-count ceiling is exceeded.\"\"\"\n    monkeypatch.setenv(\"LEADS_MAX_RECORD_BYTES\", \"64\")\n    monkeypatch.setenv(\"LEADS_MAX_FILE_BYTES\", \"128\")\n    monkeypatch.setenv(\"LEADS_MAX_RECORDS\", \"1\")\n    path = tmp_path / \"events.jsonl\"\n    path.write_bytes(b'{\"a\":1}\\n{\"b\":2}\\n')\n    rows = iter_jsonl(path)\n    assert next(rows) == {\"a\": 1}\n    with pytest.raises(ValueError, match=\"LEADS_MAX_RECORDS\"):\n        next(rows)\n\n\n'''
          if extra not in source:
              if insert_after not in source:
                  raise SystemExit('incremental replay test target missing')
              source = source.replace(insert_after, insert_after + extra, 1)
          tests.write_text(source, encoding='utf-8')

          apify = Path('tests/test_apify_discovery.py')
          text = apify.read_text(encoding='utf-8')
          old = '            "waitForFinish": "60",\n'
          if old not in text:
              raise SystemExit('Apify waitForFinish expectation missing')
          apify.write_text(text.replace(old, '            "waitForFinish": "0",\n', 1), encoding='utf-8')

          extraction = Path('tests/test_extraction.py')
          text = extraction.read_text(encoding='utf-8')
          text = text.replace(
              'def test_invalid_fact_schema_is_rejected_without_repair(mutate: Any) -> None:\n    """Missing/extra/type/confidence/citation violations fail after only one paid call."""\n',
              'def test_invalid_fact_schema_retries_within_the_fixed_bound(mutate: Any) -> None:\n    """Retryable schema-invalid model output is retried only within the fixed bound."""\n',
              1,
          )
          text = text.replace('    assert calls == 1\n    assert caught.value.kind == "invalid_response"\n', '    assert calls == 3\n    assert caught.value.kind == "invalid_response"\n', 1)
          old_block = '''def test_invalid_json_and_truncated_output_make_no_automatic_repair_call() -> None:\n    """Malformed or truncated output fails once and is never repaired with a second call."""\n    responses = [\n        _response(content="{not-json"),\n        _response(finish_reason="length"),\n    ]\n    calls = 0\n\n    def handler(_request: httpx.Request) -> httpx.Response:\n        nonlocal calls\n        response = responses[calls]\n        calls += 1\n        return httpx.Response(200, json=response)\n\n    with httpx.Client(transport=httpx.MockTransport(handler)) as client:\n        extractor = DeepSeekExtractor(\n            api_key=API_KEY,\n            client=client,\n            model=MODEL,\n            prices=PRICES,\n        )\n        with pytest.raises(DiscoveryProviderError):\n            extractor.extract(_company(), _bundle())\n        with pytest.raises(DiscoveryProviderError):\n            extractor.extract(_company(), _bundle())\n\n    assert calls == 2\n'''
          new_block = '''@pytest.mark.parametrize(\n    "response",\n    [\n        _response(content="{not-json"),\n        _response(finish_reason="length"),\n    ],\n)\ndef test_invalid_json_and_truncated_output_retry_only_within_bound(\n    response: dict[str, Any],\n) -> None:\n    """Malformed or truncated model output retries exactly to the fixed attempt ceiling."""\n    calls = 0\n\n    def handler(_request: httpx.Request) -> httpx.Response:\n        nonlocal calls\n        calls += 1\n        return httpx.Response(200, json=response)\n\n    with httpx.Client(transport=httpx.MockTransport(handler)) as client:\n        extractor = DeepSeekExtractor(\n            api_key=API_KEY,\n            client=client,\n            model=MODEL,\n            prices=PRICES,\n        )\n        with pytest.raises(DiscoveryProviderError) as caught:\n            extractor.extract(_company(), _bundle())\n\n    assert calls == 3\n    assert caught.value.usage_event.request_count == 3\n'''
          if old_block not in text:
              raise SystemExit('old malformed/truncated test block missing')
          extraction.write_text(text.replace(old_block, new_block, 1), encoding='utf-8')

          batch = Path('tests/test_m2_batch.py')
          text = batch.read_text(encoding='utf-8')
          old = '_config(tmp_path, "exa-research-budget", exa_budget_usd=0.01),'
          if old not in text:
              raise SystemExit('research budget test config missing')
          batch.write_text(
              text.replace(
                  old,
                  '_config(tmp_path, "exa-research-budget", exa_budget_usd=0.021),',
                  1,
              ),
              encoding='utf-8',
          )
          PY
      - name: Validate all checks
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          mypy src tests
          pytest
          python -m build
          python -m leads_discovery run --run-id ci-dry --deepseek-budget-usd 0.01
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/generate-leads.yml').read_text(encoding='utf-8')
          trigger = text.split('permissions:', 1)[0]
          assert 'workflow_dispatch:' in trigger
          assert 'push:' not in trigger
          assert 'pull_request:' not in trigger
          assert 'schedule:' not in trigger
          assert 'inputs:' not in trigger
          assert 'runs-on: ubuntu-latest' in text
          assert 'actions/upload-artifact' not in text
          assert 'python -m leads_discovery.production_canary' in text
          assert 'generated-leads' in text
          PY
      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example .github/workflows/ci.yml .github/workflows/generate-leads.yml README.md \
            src/leads_discovery/cli.py src/leads_discovery/contacts/providers.py \
            src/leads_discovery/pipeline/contact_enrichment.py src/leads_discovery/pipeline/m2_batch.py \
            src/leads_discovery/pipeline/state.py src/leads_discovery/research/extract.py \
            tests/test_apify_discovery.py tests/test_extraction.py tests/test_m2_batch.py \
            tests/test_production_readiness.py
          git commit -m "[autofix] Finish readiness" \
            -m "Complete provider retry and pre-dispatch budget semantics, bounded persistence, fixed one-company workflow controls, focused production-readiness tests, concise runtime documentation, and CI dry/static validation. Align existing production tests with the required Apify start/poll and bounded DeepSeek retry contracts. Ruff, strict mypy, full pytest, build, offline dry run, and workflow safety checks all passed before this commit."
          git push origin HEAD:codex/production-readiness
