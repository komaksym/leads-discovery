name: Issue 46 review fix verification clean

on:
  push:
    branches:
      - fix/issue-46-review-findings

permissions:
  contents: write

jobs:
  tdd-fix-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-46-review-findings
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply corrected RED tests
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/issue-46-review-fix.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"          python - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if len(blocks) != 2:
              raise SystemExit(f'expected 2 embedded patch blocks, found {len(blocks)}')
          exec(compile(textwrap.dedent(blocks[0]), '<issue46-test-patch>', 'exec'), {})

          gating = Path('tests/test_canary_apollo_shadow_gating.py')
          text = gating.read_text(encoding='utf-8')
          old = '    assert report.overall_outcome == "inconclusive"\n'
          if text.count(old) != 1:
              raise SystemExit('expected one over-broad overall outcome assertion')
          gating.write_text(text.replace(old, '', 1), encoding='utf-8', newline='\n')

          safety = Path('tests/test_production_canary_offline_safety_contract.py')
          text = safety.read_text(encoding='utf-8')
          old = '    assert report["pipeline_outcome"] == "inconclusive"\n'
          new = '    assert report["pipeline_outcome"] == "success"\n'
          if text.count(old) != 1:
              raise SystemExit('expected one stale pipeline-outcome assertion')
          safety.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Verify RED test style and typing
        run: |
          ruff check \
            tests/test_canary_apollo_shadow_gating.py \
            tests/test_canary_provider_coverage.py \
            tests/test_production_canary_offline_contract.py \
            tests/test_production_canary_offline_review_gaps.py \
            tests/test_production_canary_offline_safety_contract.py
          mypy \
            tests/test_canary_apollo_shadow_gating.py \
            tests/test_canary_provider_coverage.py \
            tests/test_production_canary_offline_contract.py \
            tests/test_production_canary_offline_review_gaps.py \
            tests/test_production_canary_offline_safety_contract.py

      - name: Commit RED tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_canary_apollo_shadow_gating.py \
            tests/test_canary_provider_coverage.py \
            tests/test_production_canary_offline_contract.py \
            tests/test_production_canary_offline_review_gaps.py \
            tests/test_production_canary_offline_safety_contract.py
          git commit -m "test: forbid shadow Clay from authorizing Apollo"
          echo "RED_COMMIT=$(git rev-parse HEAD)"

      - name: Verify clean behavioral RED
        shell: bash
        run: |
          set +e
          pytest -q \
            tests/test_canary_apollo_shadow_gating.py \
            tests/test_canary_provider_coverage.py \
            tests/test_production_canary_offline_contract.py \
            tests/test_production_canary_offline_review_gaps.py \
            tests/test_production_canary_offline_safety_contract.py \
            2>&1 | tee /tmp/issue46-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected behavioral RED but focused tests passed"
            exit 1
          fi
          grep -q "6 failed" /tmp/issue46-red.log
          grep -q "test_nonaccepted_shadow_clay_email_never_unlocks_apollo" /tmp/issue46-red.log
          grep -q "test_shadow_clay_usable_email_without_normal_skip_reports_inconclusive" /tmp/issue46-red.log
          grep -q "test_rejected_company_coverage_uses_production_lineage_without_mutating_contacts" /tmp/issue46-red.log
          grep -q "test_coverage_instantly_resumes_same_email_and_stops_at_three_reads" /tmp/issue46-red.log
          grep -q "test_coverage_only_clay_verifies_selected_contact_without_mutating_normal_state" /tmp/issue46-red.log
          echo "Behavioral RED confirmed at $(git rev-parse HEAD)"

      - name: Apply minimal production fix
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/issue-46-review-fix.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"          python - <<'PY'\n(.*?)\n          PY", workflow, re.S)
          if len(blocks) != 2:
              raise SystemExit(f'expected 2 embedded patch blocks, found {len(blocks)}')
          exec(compile(textwrap.dedent(blocks[1]), '<issue46-production-patch>', 'exec'), {})
          PY

      - name: Commit production fix
        run: |
          git add \
            src/leads_discovery/pipeline/contact_enrichment.py \
            src/leads_discovery/pipeline/canary_provider_coverage.py \
            src/leads_discovery/pipeline/canary_outcomes.py
          git commit -m "fix: derive Apollo shadow gate from normal M4 authority"
          echo "PRODUCTION_COMMIT=$(git rev-parse HEAD)"

      - name: Verify focused GREEN
        run: |
          pytest -q \
            tests/test_canary_apollo_shadow_gating.py \
            tests/test_canary_provider_coverage.py \
            tests/test_production_canary_offline_contract.py \
            tests/test_production_canary_offline_review_gaps.py \
            tests/test_production_canary_offline_safety_contract.py

      - name: Verify implementation style and typing
        run: |
          ruff check .
          mypy src tests

      - name: Verify full suite before cleanup
        run: pytest -q

      - name: Remove temporary verification workflows
        run: |
          git rm \
            .github/workflows/issue-46-review-fix.yml \
            .github/workflows/issue-46-review-fix-2.yml
          git commit -m "chore: remove temporary issue 46 verification workflows"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"

      - name: Verify exact final tree
        run: |
          ruff check .
          mypy src tests
          pytest -q

      - name: Push verified commits
        run: git push origin HEAD:fix/issue-46-review-findings
