name: Production lead canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-lead-canary
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Check out trusted main for authorization
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve immutable canary target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for exact target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100"
          )"
          jq -e --arg sha "$TARGET_SHA" '
            any(
              .workflow_runs[];
              .head_sha == $sha
              and .head_branch == "main"
              and .event == "push"
              and .conclusion == "success"
            )
          ' <<<"$runs" >/dev/null

  canary:
    needs: authorize
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment: production-canary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out CI-approved main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run fixed one-company live canary
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLAY_PUBLIC_API_KEY: ${{ secrets.CLAY_PUBLIC_API_KEY }}
          CLAY_WORK_EMAIL_FUNCTION_ID: ${{ vars.CLAY_WORK_EMAIL_FUNCTION_ID }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          LEADS_MAX_HTTP_RESPONSE_BYTES: "1048576"
          LEADS_MAX_RECORD_BYTES: "131072"
          LEADS_MAX_FILE_BYTES: "4194304"
          LEADS_MAX_RUN_BYTES: "8388608"
          LEADS_MAX_RECORDS: "500"
        shell: bash
        run: |
          set -uo pipefail
          run_id="canary-${GITHUB_RUN_ID}"
          run_dir="data/$run_id"
          if python -m leads_discovery.production_canary \
            --run-id "$run_id" \
            --data-root data; then
            canary_code=0
          else
            canary_code=$?
          fi

          report="$run_dir/canary_coverage_report.json"
          if [[ ! -f "$report" || -L "$report" ]]; then
            printf '### Production canary readiness\n\n- Overall outcome: `failure`\n- Reason: private coverage report unavailable\n' \
              >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Production canary readiness: failure; private coverage report unavailable."
            exit 1
          fi

          if ! outcomes="$(
            jq -er '
              [.overall_outcome, .pipeline_outcome]
              | select(all(.[]; . == "success" or . == "inconclusive" or . == "failure"))
              | @tsv
            ' "$report"
          )"; then
            echo "::error::Production canary readiness: failure; private coverage report is invalid."
            exit 1
          fi
          IFS=$'\t' read -r overall pipeline <<<"$outcomes"

          coverage_ok=false
          if jq -e '
            .providers as $providers
            | ([$providers[].provider] | sort) ==
                ["apollo","clay","deepseek","exa_discovery","exa_people","exa_research","instantly"]
              and all($providers[]; .integration_outcome == "success")
          ' "$report" >/dev/null; then
            coverage_ok=true
          fi
          coverage_state="not-success"
          if [[ "$coverage_ok" == true ]]; then
            coverage_state="success"
          fi

          printf '### Production canary readiness\n\n- Overall outcome: `%s`\n- Pipeline outcome: `%s`\n- Required live provider coverage: `%s`\n' \
            "$overall" "$pipeline" "$coverage_state" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$canary_code" -eq 0 && "$overall" == "success" && "$pipeline" == "success" && "$coverage_ok" == true ]]; then
            echo "Production canary readiness: success"
            exit 0
          fi
          if [[ "$canary_code" -eq 2 && "$overall" == "inconclusive" ]]; then
            echo "::warning::Production canary readiness: inconclusive; publication is blocked."
            exit 2
          fi
          echo "::error::Production canary readiness: failure; publication is blocked."
          exit 1

      - name: Publish approved public outputs
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          run_dir="data/canary-${GITHUB_RUN_ID}"
          test -f "$run_dir/leads.csv"
          test -f "$run_dir/contacts.jsonl"
          publish_dir="$(mktemp -d)"
          cp -- "$run_dir/leads.csv" "$publish_dir/leads.csv"
          cp -- "$run_dir/contacts.jsonl" "$publish_dir/contacts.jsonl"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git fetch origin generated-leads:refs/remotes/origin/generated-leads; then
            empty_tree="$(git mktree < /dev/null)"
            root_commit="$(git commit-tree "$empty_tree" -m "Initialize generated lead output")"
            git push origin "$root_commit:refs/heads/generated-leads"
            git update-ref refs/remotes/origin/generated-leads "$root_commit"
          fi
          git switch --force-create generated-leads refs/remotes/origin/generated-leads
          git rm -rf --ignore-unmatch .
          cp -- "$publish_dir/leads.csv" leads.csv
          cp -- "$publish_dir/contacts.jsonl" contacts.jsonl
          git add -- leads.csv contacts.jsonl
          test "$(git diff --cached --name-only | sort)" = $'contacts.jsonl\nleads.csv'

          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update generated leads" \
            -m "Publish only the approved bounded leads.csv and contacts.jsonl outputs from the one-company production canary."
          git push origin HEAD:generated-leads