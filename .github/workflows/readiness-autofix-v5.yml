name: Readiness autofix v5

on:
  push:
    branches:
      - codex/production-readiness

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/production-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply readiness patch and align legacy tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path('.github/workflows/readiness-autofix.yml').read_text(encoding='utf-8').splitlines()
          for step_name in ('Apply narrow readiness fixes', 'Add focused production-readiness tests'):
              start = lines.index(f'      - name: {step_name}')
              run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
              end = next(
                  (i for i in range(run_index + 1, len(lines)) if lines[i].startswith('      - name:')),
                  len(lines),
              )
              body = [line[10:] if line.startswith('          ') else '' for line in lines[run_index + 1:end]]
              subprocess.run(['bash', '-euo', 'pipefail', '-c', '\n'.join(body) + '\n'], check=True)

          tests = Path('tests/test_production_readiness.py')
          source = tests.read_text(encoding='utf-8')
          source = source.replace(
              '    facts = {\n        key: {"value": None, "confidence": 0, "evidence_ids": []}\n',
              '    facts: dict[str, dict[str, Any]] = {\n        key: {"value": None, "confidence": 0, "evidence_ids": []}\n',
              1,
          )
          replay_marker = 'def test_total_run_disk_limit_stops_before_second_write('
          extra = '''def test_oversized_replay_file_is_rejected_before_iteration(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    \"\"\"A replay file over the configured file ceiling fails closed before rows are used.\"\"\"\n    monkeypatch.setenv(\"LEADS_MAX_RECORD_BYTES\", \"64\")\n    monkeypatch.setenv(\"LEADS_MAX_FILE_BYTES\", \"8\")\n    path = tmp_path / \"events.jsonl\"\n    path.write_bytes(b'{\"ok\":1}\\n')\n    with pytest.raises(ValueError, match=\"artifact exceeds\"):\n        list(iter_jsonl(path))\n\n\ndef test_replay_record_count_is_bounded(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    \"\"\"Replay stops when the configured record-count ceiling is exceeded.\"\"\"\n    monkeypatch.setenv(\"LEADS_MAX_RECORD_BYTES\", \"64\")\n    monkeypatch.setenv(\"LEADS_MAX_FILE_BYTES\", \"128\")\n    monkeypatch.setenv(\"LEADS_MAX_RECORDS\", \"1\")\n    path = tmp_path / \"events.jsonl\"\n    path.write_bytes(b'{\"a\":1}\\n{\"b\":2}\\n')\n    rows = iter_jsonl(path)\n    assert next(rows) == {\"a\": 1}\n    with pytest.raises(ValueError, match=\"LEADS_MAX_RECORDS\"):\n        next(rows)\n\n\n'''
          if 'def test_oversized_replay_file_is_rejected_before_iteration(' not in source:
              if replay_marker not in source:
                  raise SystemExit('run disk test marker missing')
              source = source.replace(replay_marker, extra + replay_marker, 1)
          tests.write_text(source, encoding='utf-8')

          apify = Path('tests/test_apify_discovery.py')
          text = apify.read_text(encoding='utf-8')
          if '"waitForFinish": "60"' not in text:
              raise SystemExit('Apify waitForFinish value missing')
          apify.write_text(text.replace('"waitForFinish": "60"', '"waitForFinish": "0"', 1), encoding='utf-8')

          extraction = Path('tests/test_extraction.py')
          text = extraction.read_text(encoding='utf-8')
          old_name = 'def test_invalid_fact_schema_is_rejected_without_repair(mutate: Any) -> None:'
          if old_name not in text:
              raise SystemExit('invalid fact schema test name missing')
          text = text.replace(
              old_name,
              'def test_invalid_fact_schema_retries_within_the_fixed_bound(mutate: Any) -> None:',
              1,
          )
          text = text.replace(
              '    """Missing/extra/type/confidence/citation violations fail after only one paid call."""',
              '    """Retryable schema-invalid model output is retried only within the fixed bound."""',
              1,
          )
          target = '    assert calls == 1\n    assert caught.value.kind == "invalid_response"\n'
          if target not in text:
              raise SystemExit('schema retry assertion target missing')
          text = text.replace(target, '    assert calls == 3\n    assert caught.value.kind == "invalid_response"\n', 1)
          start = text.index('def test_invalid_json_and_truncated_output_make_no_automatic_repair_call() -> None:')
          end = text.index('\ndef test_apply_extraction_updates_only_m2_fact_fields_and_preserves_m1_defaults()', start)
          new_block = '''@pytest.mark.parametrize(\n    "response",\n    [\n        _response(content="{not-json"),\n        _response(finish_reason="length"),\n    ],\n)\ndef test_invalid_json_and_truncated_output_retry_only_within_bound(\n    response: dict[str, Any],\n) -> None:\n    """Malformed or truncated model output retries exactly to the fixed attempt ceiling."""\n    calls = 0\n\n    def handler(_request: httpx.Request) -> httpx.Response:\n        nonlocal calls\n        calls += 1\n        return httpx.Response(200, json=response)\n\n    with httpx.Client(transport=httpx.MockTransport(handler)) as client:\n        extractor = DeepSeekExtractor(\n            api_key=API_KEY,\n            client=client,\n            model=MODEL,\n            prices=PRICES,\n        )\n        with pytest.raises(DiscoveryProviderError) as caught:\n            extractor.extract(_company(), _bundle())\n\n    assert calls == 3\n    assert caught.value.usage_event.request_count == 3\n\n'''
          extraction.write_text(text[:start] + new_block + text[end + 1:], encoding='utf-8')

          batch = Path('tests/test_m2_batch.py')
          text = batch.read_text(encoding='utf-8')
          target = '_config(tmp_path, "exa-research-budget", exa_budget_usd=0.01),'
          if target not in text:
              raise SystemExit('research budget test target missing')
          batch.write_text(text.replace(target, '_config(tmp_path, "exa-research-budget", exa_budget_usd=0.021),', 1), encoding='utf-8')
          PY
      - name: Validate all checks
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          mypy src tests
          pytest
          python -m build
          python -m leads_discovery run --run-id ci-dry --deepseek-budget-usd 0.01
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/generate-leads.yml').read_text(encoding='utf-8')
          trigger = text.split('permissions:', 1)[0]
          assert 'workflow_dispatch:' in trigger
          assert 'push:' not in trigger
          assert 'pull_request:' not in trigger
          assert 'schedule:' not in trigger
          assert 'inputs:' not in trigger
          assert 'runs-on: ubuntu-latest' in text
          assert 'actions/upload-artifact' not in text
          assert 'python -m leads_discovery.production_canary' in text
          assert 'generated-leads' in text
          PY
      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example .github/workflows/ci.yml .github/workflows/generate-leads.yml README.md \
            src/leads_discovery/cli.py src/leads_discovery/contacts/providers.py \
            src/leads_discovery/pipeline/contact_enrichment.py src/leads_discovery/pipeline/m2_batch.py \
            src/leads_discovery/pipeline/state.py src/leads_discovery/research/extract.py \
            tests/test_apify_discovery.py tests/test_extraction.py tests/test_m2_batch.py \
            tests/test_production_readiness.py
          git commit -m "[autofix] Finish readiness" \
            -m "Complete provider retry and pre-dispatch budget semantics, bounded persistence, fixed one-company workflow controls, focused production-readiness tests, concise runtime documentation, and CI dry/static validation. Align existing production tests with the required Apify start/poll and bounded DeepSeek retry contracts. Ruff, strict mypy, full pytest, build, offline dry run, and workflow safety checks all passed before this commit."
          git push origin HEAD:codex/production-readiness
