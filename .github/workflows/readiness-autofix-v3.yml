name: Readiness autofix v3

on:
  push:
    branches:
      - codex/production-readiness

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/production-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply proven readiness patch recipe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path('.github/workflows/readiness-autofix.yml').read_text(encoding='utf-8').splitlines()
          for step_name in ('Apply narrow readiness fixes', 'Add focused production-readiness tests'):
              header = f'      - name: {step_name}'
              start = lines.index(header)
              run_index = next(
                  index for index in range(start + 1, len(lines))
                  if lines[index] == '        run: |'
              )
              end = next(
                  (
                      index for index in range(run_index + 1, len(lines))
                      if lines[index].startswith('      - name:')
                  ),
                  len(lines),
              )
              body: list[str] = []
              for line in lines[run_index + 1:end]:
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif line.strip():
                      raise SystemExit(f'unexpected indentation in {step_name}: {line!r}')
                  else:
                      body.append('')
              subprocess.run(
                  ['bash', '-euo', 'pipefail', '-c', '\n'.join(body) + '\n'],
                  check=True,
              )

          tests = Path('tests/test_production_readiness.py')
          source = tests.read_text(encoding='utf-8')
          old = '    facts = {\n        key: {"value": None, "confidence": 0, "evidence_ids": []}\n'
          new = '    facts: dict[str, dict[str, Any]] = {\n        key: {"value": None, "confidence": 0, "evidence_ids": []}\n'
          if old not in source:
              raise SystemExit('test fact annotation target missing')
          source = source.replace(old, new, 1)
          insert_after = '''def test_replay_is_incremental_and_oversized_record_fails_at_that_record(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    \"\"\"A good first replay row is yielded before an oversized later row is rejected.\"\"\"\n    monkeypatch.setenv(\"LEADS_MAX_RECORD_BYTES\", \"32\")\n    monkeypatch.setenv(\"LEADS_MAX_FILE_BYTES\", \"1024\")\n    path = tmp_path / \"events.jsonl\"\n    path.write_bytes(b'{\"ok\":1}\\n' + b'{\"x\":\"' + b\"a\" * 100 + b'\"}\\n')\n    rows = iter_jsonl(path)\n    assert next(rows) == {\"ok\": 1}\n    with pytest.raises(ValueError, match=\"record exceeds\"):\n        next(rows)\n\n\n'''
          extra = '''def test_oversized_replay_file_is_rejected_before_iteration(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    \"\"\"A replay file over the configured file ceiling fails closed before rows are used.\"\"\"\n    monkeypatch.setenv(\"LEADS_MAX_RECORD_BYTES\", \"64\")\n    monkeypatch.setenv(\"LEADS_MAX_FILE_BYTES\", \"8\")\n    path = tmp_path / \"events.jsonl\"\n    path.write_bytes(b'{\"ok\":1}\\n')\n    with pytest.raises(ValueError, match=\"artifact exceeds\"):\n        list(iter_jsonl(path))\n\n\ndef test_replay_record_count_is_bounded(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    \"\"\"Replay stops when the configured record-count ceiling is exceeded.\"\"\"\n    monkeypatch.setenv(\"LEADS_MAX_RECORD_BYTES\", \"64\")\n    monkeypatch.setenv(\"LEADS_MAX_FILE_BYTES\", \"128\")\n    monkeypatch.setenv(\"LEADS_MAX_RECORDS\", \"1\")\n    path = tmp_path / \"events.jsonl\"\n    path.write_bytes(b'{\"a\":1}\\n{\"b\":2}\\n')\n    rows = iter_jsonl(path)\n    assert next(rows) == {\"a\": 1}\n    with pytest.raises(ValueError, match=\"LEADS_MAX_RECORDS\"):\n        next(rows)\n\n\n'''
          if insert_after not in source:
              raise SystemExit('incremental replay test target missing')
          tests.write_text(source.replace(insert_after, insert_after + extra, 1), encoding='utf-8')
          PY
      - name: Validate all checks
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          mypy src tests
          pytest
          python -m build
          python -m leads_discovery run --run-id ci-dry --deepseek-budget-usd 0.01
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/generate-leads.yml').read_text(encoding='utf-8')
          trigger = text.split('permissions:', 1)[0]
          assert 'workflow_dispatch:' in trigger
          assert 'push:' not in trigger
          assert 'pull_request:' not in trigger
          assert 'schedule:' not in trigger
          assert 'inputs:' not in trigger
          assert 'runs-on: ubuntu-latest' in text
          assert 'actions/upload-artifact' not in text
          assert 'python -m leads_discovery.production_canary' in text
          assert 'generated-leads' in text
          PY
      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example .github/workflows/ci.yml .github/workflows/generate-leads.yml README.md \
            src/leads_discovery/cli.py src/leads_discovery/contacts/providers.py \
            src/leads_discovery/pipeline/contact_enrichment.py src/leads_discovery/pipeline/m2_batch.py \
            src/leads_discovery/pipeline/state.py src/leads_discovery/research/extract.py \
            tests/test_production_readiness.py
          git commit -m "[autofix] Finish readiness" \
            -m "Complete provider retry and pre-dispatch budget semantics, bounded persistence, fixed one-company workflow controls, focused production-readiness tests, concise runtime documentation, and CI dry/static validation. Ruff, strict mypy, full pytest, build, offline dry run, and workflow safety checks all passed before this commit."
          git push origin HEAD:codex/production-readiness
