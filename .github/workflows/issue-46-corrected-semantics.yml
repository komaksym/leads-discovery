name: Issue 46 corrected semantics verification

on:
  push:
    branches:
      - fix/issue-46-review-findings

permissions:
  contents: write

jobs:
  verify-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-46-review-findings
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply corrected semantics
        run: |
          python .github/issue46_correct.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_production_canary_offline_contract.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def test_coverage_instantly_resumes_same_email_and_stops_at_three_reads(\n")
          end = text.index("\n\ndef ", start)
          region = text[start:end]
          old = '    assert len(stub.for_provider("apollo")) == 1\n'
          if region.count(old) != 1:
              raise SystemExit("expected one stale rejected-shadow Apollo assertion")
          region = region.replace(old, '    assert len(stub.for_provider("apollo")) == 0\n', 1)
          path.write_text(text[:start] + region + text[end:], encoding="utf-8", newline="\n")

          path = Path("tests/test_production_canary_offline_safety_contract.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert report["pipeline_outcome"] == "inconclusive"\n'
          if text.count(old) != 1:
              raise SystemExit("expected one stale safety pipeline assertion")
          path.write_text(
              text.replace(old, '    assert report["pipeline_outcome"] == "success"\n', 1),
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Remove one-shot verifier before validation
        run: git rm .github/issue46_correct.py .github/workflows/issue-46-corrected-semantics.yml

      - name: Verify ruff and mypy
        run: |
          ruff check .
          mypy src tests

      - name: Verify focused Apollo and canary contracts
        run: |
          pytest -q \
            tests/test_canary_apollo_shadow_gating.py \
            tests/test_canary_provider_coverage.py \
            tests/test_canary_outcomes.py \
            tests/test_production_canary_offline_contract.py \
            tests/test_production_canary_offline_review_gaps.py \
            tests/test_production_canary_offline_safety_contract.py

      - name: Verify full suite
        run: pytest -q

      - name: Commit and push verified correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/leads_discovery/pipeline/canary_provider_coverage.py \
            src/leads_discovery/pipeline/canary_outcomes.py \
            tests/test_canary_provider_coverage.py \
            tests/test_production_canary_offline_contract.py \
            tests/test_production_canary_offline_review_gaps.py \
            tests/test_production_canary_offline_safety_contract.py
          git commit -m "fix: enforce normal-authority Apollo coverage semantics"
          git push origin HEAD:fix/issue-46-review-findings
