name: Readiness autofix v6

on:
  push:
    branches:
      - codex/production-readiness

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/production-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Rebuild validated tree
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path('.github/workflows/readiness-autofix-v5.yml').read_text(encoding='utf-8').splitlines()
          start = lines.index('      - name: Apply readiness patch and align legacy tests')
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run_index + 1, len(lines)) if lines[i].startswith('      - name:'))
          body = [line[10:] if line.startswith('          ') else '' for line in lines[run_index + 1:end]]
          subprocess.run(['bash', '-euo', 'pipefail', '-c', '\n'.join(body) + '\n'], check=True)

          # Reject symlinked data roots consistently in every writable M3/M4 boundary.
          for path in (
              'src/leads_discovery/pipeline/evaluation.py',
              'src/leads_discovery/pipeline/contact_enrichment.py',
          ):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              old = '    root = config.data_root.expanduser().resolve()\n'
              new = (
                  '    expanded_root = config.data_root.expanduser()\n'
                  '    if expanded_root.is_symlink():\n'
                  '        raise ValueError("data_root must not be a symlink")\n'
                  '    root = expanded_root.resolve()\n'
              )
              if old not in text:
                  raise SystemExit(f'data_root target missing in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_production_readiness.py')
          source = tests.read_text(encoding='utf-8')
          marker = 'def test_atomic_write_rejects_symlink_target(tmp_path: Path) -> None:\n'
          extra = '''def test_m4_rejects_symlinked_data_root(tmp_path: Path) -> None:\n    \"\"\"The M4 writable root itself cannot be a symlink.\"\"\"\n    real = tmp_path / \"real-data\"\n    real.mkdir()\n    alias = tmp_path / \"alias-data\"\n    alias.symlink_to(real, target_is_directory=True)\n    with pytest.raises(ValueError, match=\"data_root must not be a symlink\"):\n        run_contact_enrichment(\n            ContactEnrichmentConfig(\n                run_id=\"root-link\",\n                data_root=alias,\n                exa_people_budget_usd=0.02,\n                execute_live=True,\n            ),\n            exa=_BombExa(),\n            clay=_BombClay(),\n            apollo=_BombApollo(),\n            instantly=_BombInstantly(),\n        )\n\n\n'''
          if 'def test_m4_rejects_symlinked_data_root(' not in source:
              if marker not in source:
                  raise SystemExit('symlink test insertion point missing')
              source = source.replace(marker, extra + marker, 1)
          tests.write_text(source, encoding='utf-8')
          PY
      - name: Validate all checks
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
          mypy src tests
          pytest
          python -m build
          python -m leads_discovery run --run-id ci-dry --deepseek-budget-usd 0.01
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/generate-leads.yml').read_text(encoding='utf-8')
          trigger = text.split('permissions:', 1)[0]
          assert 'workflow_dispatch:' in trigger
          assert 'push:' not in trigger
          assert 'pull_request:' not in trigger
          assert 'schedule:' not in trigger
          assert 'inputs:' not in trigger
          assert 'runs-on: ubuntu-latest' in text
          assert 'actions/upload-artifact' not in text
          assert 'python -m leads_discovery.production_canary' in text
          assert 'generated-leads' in text
          PY
      - name: Commit validated non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example README.md \
            src/leads_discovery/cli.py src/leads_discovery/contacts/providers.py \
            src/leads_discovery/pipeline/contact_enrichment.py src/leads_discovery/pipeline/evaluation.py \
            src/leads_discovery/pipeline/m2_batch.py src/leads_discovery/pipeline/state.py \
            src/leads_discovery/research/extract.py \
            tests/test_apify_discovery.py tests/test_extraction.py tests/test_m2_batch.py \
            tests/test_production_readiness.py
          git commit -m "[autofix] Finish readiness code" \
            -m "Persist the fully validated production-readiness runtime, resource bounds, immutable canary behavior, symlink-root hardening, documentation, and focused tests. Ruff, strict mypy, 405 tests, build, offline dry run, and workflow safety checks passed before this commit. Workflow YAML is intentionally excluded because GITHUB_TOKEN cannot update workflow files."
          git push origin HEAD:codex/production-readiness
